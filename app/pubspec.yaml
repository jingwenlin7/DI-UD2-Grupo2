name: app_citas
description: >-
  Página sencilla en Flutter con un widget de calendario, un widget de hora y
  el botón reutilizable del paquete boton_grupal.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.6.0
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  boton_grupal:
    path: ../boton_grupal

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/data/citas.json
